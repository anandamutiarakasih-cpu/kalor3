<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thermo Champions: Heat Edition — Permainan Pembelajaran IPA Kalor SMP</title>
  <meta name="description" content="Aplikasi permainan edukasi sains materi Kalor untuk 40 siswa dan 1 guru SMP dengan sistem multiplayer realtime, leaderboard, dan tantangan kalkulasi fisika.">
  <meta name="theme-color" content="#0F172A">

  <!-- Favicon (Thermal Flame SVG Data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F97316'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z'/%3E%3C/svg%3E">

  <!-- Google Web Fonts (Optimized Non-blocking with display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  </noscript>

  <!-- Critical Stylesheets (FCP Priority) -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <!-- Preloaded Game View Stylesheets (Async, Non-blocking) -->
  <link rel="preload" href="/css/game1.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="/css/game2.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="/css/game3.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="/css/leaderboard.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/css/game1.css">
    <link rel="stylesheet" href="/css/game2.css">
    <link rel="stylesheet" href="/css/game3.css">
    <link rel="stylesheet" href="/css/leaderboard.css">
  </noscript>
</head>
<body>
  <!-- Thermal Convection Particles Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main View Mount Container -->
  <main id="app-main" role="main"></main>

  <!-- Socket.IO Client Library (Authoritative Multiplayer - Non-blocking Deferred) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>

  <!-- Supabase Client Library (Multiplayer Realtime Mesh & DB - Non-blocking Deferred) -->
  <script src="/js/lib/supabase.js" defer></script>

  <!-- Application Entrypoint (ES Module) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
